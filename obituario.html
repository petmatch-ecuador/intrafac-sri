<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homenaje Memorial | Nexora Suite</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0f172a; color: #f8fafc; }
        .memorial-container { max-width: 720px; margin: 2rem auto; padding: 1rem; }
        .memorial-card { background: #1e293b; border-radius: 16px; padding: 2rem; text-align: center; border: 1px solid #334155; }
        .memorial-ribbon { color: #fbbf24; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; font-weight: 600; }
        .memorial-name { font-size: 2rem; margin: 0.5rem 0; color: #fff; }
        .memorial-epitaph { font-style: italic; color: #cbd5e1; margin-bottom: 1.5rem; }
        .info-box { background: #0f172a; padding: 1rem; border-radius: 10px; margin-bottom: 1rem; text-align: left; }
        .condolence-item { background: #0f172a; padding: 1rem; border-radius: 8px; margin-bottom: 0.75rem; text-align: left; border-left: 3px solid #fbbf24; }
    </style>
</head>
<body>
    <div class="memorial-container">
        <div id="loading" style="text-align:center; padding:3rem;">Cargando memorial...</div>
        
        <div id="memorial-content" class="memorial-card hidden">
            <div class="memorial-ribbon">En Memoria de</div>
            <h1 id="ob-nombre" class="memorial-name"></h1>
            <p id="ob-epitafio" class="memorial-epitaph"></p>

            <div class="info-box">
                <p><strong>Sala de Velación:</strong> <span id="ob-sala">Por confirmar</span></p>
                <p><strong>Camposanto / Destino:</strong> <span id="ob-camposanto">Por confirmar</span></p>
                <p><strong>Fecha de Fallecimiento:</strong> <span id="ob-fecha"></span></p>
            </div>

            <div style="text-align:left; margin-top:2rem;">
                <h3 style="color:#fbbf24; margin-bottom:0.75rem;">Dejar una Condolencia a la Familia</h3>
                <form id="form-condolencia">
                    <div class="form-group">
                        <input type="text" id="cond-autor" required placeholder="Tu nombre completo" style="background:#0f172a; color:#fff; border-color:#334155;">
                    </div>
                    <div class="form-group">
                        <input type="text" id="cond-relacion" placeholder="Parentesco o amistad (Ej: Compañeros de trabajo)" style="background:#0f172a; color:#fff; border-color:#334155;">
                    </div>
                    <div class="form-group">
                        <textarea id="cond-mensaje" rows="3" required placeholder="Escribe aquí tus palabras de apoyo..." style="background:#0f172a; color:#fff; border-color:#334155;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;">Publicar Condolencia</button>
                </form>

                <h3 style="margin:2rem 0 1rem;">Libro de Condolencias</h3>
                <div id="lista-condolencias"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fmsjkibcczmjsxoodzae.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_JY2cBrl5RAp1dqbjgTC3SA_-DAKJknF';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');
        let currentObituarioId = null;

        async function loadMemorial() {
            if (!slug) {
                document.getElementById('loading').innerText = 'Enlace de obituario no válido.';
                return;
            }
            const { data, error } = await sb
                .from('obituarios_digitales')
                .select('*, servicios_funerarios(fallecido_nombres, fecha_fallecimiento, camposanto_destino, salas_velacion(nombre))')
                .eq('slug_publico', slug)
                .single();

            if (error || !data) {
                document.getElementById('loading').innerText = 'Obituario no encontrado o no publicado.';
                return;
            }

            currentObituarioId = data.id;
            const srv = data.servicios_funerarios;
            document.getElementById('ob-nombre').innerText = srv.fallecido_nombres;
            document.getElementById('ob-epitafio').innerText = `"${data.epitafio}"`;
            document.getElementById('ob-sala').innerText = srv.salas_velacion?.nombre || 'Sala Principal';
            document.getElementById('ob-camposanto').innerText = srv.camposanto_destino || 'Por definir';
            document.getElementById('ob-fecha').innerText = new Date(srv.fecha_fallecimiento).toLocaleDateString('es-EC');

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('memorial-content').classList.remove('hidden');
            loadCondolencias();
        }

        async function loadCondolencias() {
            const { data } = await sb
                .from('condolencias_obituario')
                .select('*')
                .eq('obituario_id', currentObituarioId)
                .order('created_at', { ascending: false });

            const container = document.getElementById('lista-condolencias');
            container.innerHTML = (data || []).map(c => `
                <div class="condolence-item">
                    <strong>${c.autor_nombre}</strong> <small style="color:#94a3b8;">(${c.parentesco_relacion || 'Amigo/a'})</small>
                    <p style="margin-top:0.35rem; color:#e2e8f0;">${c.mensaje}</p>
                </div>
            `).join('') || '<p style="color:#94a3b8;">Sé el primero en dejar un mensaje de apoyo.</p>';
        }

        document.getElementById('form-condolencia').addEventListener('submit', async (e) => {
            e.preventDefault();
            await sb.from('condolencias_obituario').insert({
                obituario_id: currentObituarioId,
                autor_nombre: document.getElementById('cond-autor').value,
                parentesco_relacion: document.getElementById('cond-relacion').value,
                mensaje: document.getElementById('cond-mensaje').value
            });
            e.target.reset();
            loadCondolencias();
        });

        loadMemorial();
    </script>
</body>
</html>
